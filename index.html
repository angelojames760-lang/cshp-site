<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>cshop.dev — Seller Operations</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://cloudflare.com"></script>
  <style>
    :root { --bg-main: #0f1012; --bg-card: #18191c; --bg-input: #232428; --border: #2b2d31; --accent: #5865f2; --accent-hover: #4752c4; --success: #23a559; --danger: #f23f43; --text-primary: #f2f3f5; --text-muted: #949ba4; }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 20px 14px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-shell { width: 100%; max-width: 500px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 14px 36px rgba(0,0,0,0.6); }
    .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
    .version { font-size: 11px; color: var(--text-muted); background: var(--bg-input); padding: 3px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
    .lock-screen { padding: 36px 24px; text-align: center; }
    .lock-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .lock-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
    .key-input { text-align: center; font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; margin-bottom: 12px; }
    .main-dashboard { display: none; }
    .nav-tabs { display: flex; background: #141518; border-bottom: 1px solid var(--border); }
    .nav-btn { flex: 1; padding: 12px 6px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .nav-btn.active { color: var(--text-primary); border-bottom-color: var(--accent); background: rgba(88, 101, 242, 0.08); }
    .panel { display: none; padding: 20px; }
    .panel.active { display: block; }
    .field-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    input, textarea, select { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 13px; outline: none; }
    textarea { resize: vertical; min-height: 95px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-secondary { background: #2e3035; margin-top: 8px; }
    .totp-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 18px; text-align: center; margin: 14px 0; }
    .totp-code { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: 4px; }
    .totp-timer { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .toast { font-size: 12px; text-align: center; margin-top: 10px; color: var(--success); min-height: 16px; }
    .footer { padding: 12px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .logout-link { color: var(--danger); cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="header">
    <div class="brand"><span class="brand-dot"></span> cshop.dev</div>
    <div class="version">v1.2</div>
  </div>
  <div id="lockScreen" class="lock-screen">
    <div class="lock-title">License Authentication</div>
    <div class="lock-sub">Enter your authorized access key to unlock the workspace.</div>
    <input type="text" id="licenseInput" class="key-input" placeholder="CSHOP-XXXX-XXXX-XXXX">
    <button type="button" class="btn" onclick="verifyLicense()">Verify Access Key</button>
    <div id="lockToast" class="toast" style="color: var(--danger);"></div>
  </div>
  <div id="mainDashboard" class="main-dashboard">
    <div class="nav-tabs">
      <button type="button" class="nav-btn active" onclick="openTab('tab-wh', this)">Webhook</button>
      <button type="button" class="nav-btn" onclick="openTab('tab-fmt', this)">Formatter</button>
      <button type="button" class="nav-btn" onclick="openTab('tab-2fa', this)">2FA Auth</button>
    </div>
    <div id="tab-wh" class="panel active">
      <div class="field-group"><label>Webhook Endpoint URL</label><input type="text" id="whUrl" placeholder="https://discord.com..."></div>
      <div class="row">
        <div class="field-group"><label>Bot Display Name</label><input type="text" id="whName" placeholder="System Notice"></div>
        <div class="field-group"><label>Accent Color</label><input type="color" id="whColor" value="#5865f2" style="height: 38px; padding: 2px;"></div>
      </div>
      <div class="field-group"><label>Embed Header / Title</label><input type="text" id="whTitle" placeholder="Stock Update / Announcement"></div>
      <div class="field-group"><label>Payload Message</label><textarea id="whDesc" placeholder="Supports Discord markdown..."></textarea></div>
      <button type="button" class="btn" onclick="dispatchWebhook()">Dispatch Payload</button>
      <div id="whToast" class="toast"></div>
    </div>
    <div id="tab-fmt" class="panel">
      <div class="field-group"><label>Raw Input (email:pass or email:pass:secret)</label><textarea id="rawStock" placeholder="user@domain.com:Pass123:JBSWY3DPEHPK3PXP"></textarea></div>
      <div class="field-group"><label>Output Structure</label><select id="formatType"><option value="clean">Customer Delivery Ticket</option><option value="emailpass">Credentials Only</option><option value="2fa">2FA Secrets Only</option></select></div>
      <button type="button" class="btn" onclick="processStock()">Parse & Format</button>
      <div class="field-group" style="margin-top: 14px;"><label>Formatted Output</label><textarea id="formattedOutput" readonly></textarea></div>
      <button type="button" class="btn btn-secondary" onclick="copyText('formattedOutput', 'fmtToast')">Copy Output</button>
      <div id="fmtToast" class="toast"></div>
    </div>
    <div id="tab-2fa" class="panel">
      <div class="field-group"><label>2FA Secret / Setup Key</label><input type="text" id="totpSecret" placeholder="Paste Base32 secret key here..." oninput="generateTOTP()"></div>
      <div class="totp-box"><div class="totp-code" id="totpDisplay">000000</div><div class="totp-timer" id="totpTimer">Waiting for secret key</div></div>
      <button type="button" class="btn" onclick="copyTOTP()">Copy 6-Digit Code</button>
      <div id="totpToast" class="toast"></div>
    </div>
    <div class="footer"><span>Nexus Digital Operations</span><a class="logout-link" onclick="lockApp()">Lock Session</a></div>
  </div>
</div>
<script>
  const ENCODED_KEYS = ["Q1NIT1AtMjAyNi1ORVcx", "Q1NIT1AtMjAyNi1WSVAy"];

  function verifyLicense() {
    const rawInput = document.getElementById('licenseInput').value.trim().toUpperCase();
    const toast = document.getElementById('lockToast');
    if (!rawInput) return;
    if (ENCODED_KEYS.includes(btoa(rawInput))) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('mainDashboard').style.display = 'block';
      toast.innerText = "";
    } else {
      toast.style.color = '#f23f43';
      toast.innerText = "Invalid or unauthorized access key.";
    }
  }

  function openTab(tabId, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function lockApp() {
    document.getElementById('mainDashboard').style.display = 'none';
    document.getElementById('lockScreen').style.display = 'block';
    document.getElementById('licenseInput').value = '';
  }

  async function dispatchWebhook() {
    const url = document.getElementById('whUrl').value.trim();
    const username = document.getElementById('whName').value.trim() || "System Notice";
    const colorHex = document.getElementById('whColor').value.replace('#', '');
    const title = document.getElementById('whTitle').value.trim();
    const description = document.getElementById('whDesc').value.trim();
    const toast = document.getElementById('whToast');
    if (!url || (!title && !description)) { toast.style.color = '#f23f43'; toast.innerText = "Webhook URL and payload content are required."; return; }
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, embeds: [{ title, description, color: parseInt(colorHex, 16) }] }) });
      toast.style.color = res.ok ? '#23a559' : '#f23f43';
      toast.innerText = res.ok ? "Payload dispatched." : `Endpoint rejected payload (${res.status}).`;
    } catch (e) { toast.style.color = '#f23f43'; toast.innerText = "Network error."; }
    setTimeout(() => toast.innerText = "", 3000);
  }

  function processStock() {
    const raw = document.getElementById('rawStock').value.trim();
    const type = document.getElementById('formatType').value;
    if (!raw) return;
    document.getElementById('formattedOutput').value = raw.split('\n').filter(l => l.trim() !== '').map((line, i) => {
      const parts = line.trim().split(':');
      const email = parts[0] || '', pass = parts[1] || '', secret = parts[2] || 'N/A';
      if (type === 'clean') return `[Order #${i + 1}]\nEmail: ${email}\nPassword: ${pass}\n2FA Key: ${secret}\n`;
      return type === 'emailpass' ? `${email}:${pass}` : secret;
    }).join('\n');
  }

  function copyText(id, toastId) {
    const el = document.getElementById(id);
    if (!el.value) return;
    navigator.clipboard.writeText(el.value);
    document.getElementById(toastId).innerText = "Copied to clipboard.";
    setTimeout(() => document.getElementById(toastId).innerText = "", 2000);
  }

  let totpInterval;
  function generateTOTP() {
    clearInterval(totpInterval);
    const rawSecret = document.getElementById('totpSecret').value.replace(/\s+/g, '').toUpperCase();
    const display = document.getElementById('totpDisplay'), timer = document.getElementById('totpTimer');
    if (!rawSecret) { display.innerText = "000000"; timer.innerText = "Waiting for secret key"; return; }
    const update = () => {
      try {
        const totp = new OTPAuth.TOTP({ algorithm: 'SHA1', digits: 6, period: 30, secret: OTPAuth.Secret.fromBase32(rawSecret) });
        display.innerText = totp.generate();
        timer.innerText = `Refreshes in ${30 - (Math.floor(Date.now() / 1000) % 30)}s`;
      } catch (err) { display.innerText = "INVALID"; timer.innerText = "Invalid Base32 secret"; }
    };
    update();
    totpInterval = setInterval(update, 1000);
  }

  function copyTOTP() {
    const code = document.getElementById('totpDisplay').innerText;
    if (code === "000000" || code === "INVALID") return;
    navigator.clipboard.writeText(code);
    document.getElementById('totpToast').innerText = "2FA code copied.";
    setTimeout(() => document.getElementById('totpToast').innerText = "", 2000);
  }
</script>
</body>
</html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>CheapShop</title>
  <meta name="description" content="Sulit at abot-kayang items sa CheapShop. Tingnan ang aming mga available products dito.">
  
  <!-- Para lumabas ang "CheapShop" bilang mismong pangalan sa Google -->
  <meta property="og:site_name" content="CheapShop">
  <meta property="og:title" content="CheapShop">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://github.io">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CheapShop",
    "url": "https://github.io"
  }
  </script>
</head>
